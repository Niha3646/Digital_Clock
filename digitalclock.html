<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="digitalclock.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body id="container ">
    <div>
        <h3 id="clock"><i class="fa-solid fa-clock"></i>TimeNow</h3>
        <p id="discrp">Stay on Time,Stay Ahead</p>
    </div>
    <div id="light">
        <button id="lightbtn">Light</button>
        <button id="darkbtn">Dark</button>
    </div>
    <div id="clockcontainer">
        <p>____CURRENT TIME____</p>
        <h1>Digital Clock</h1>
        <p>Simple.Beautiful.AlwaysAccurate.</p>
    </div>
    <div id="time">
        <h2 id="timedisplay">00:00:00</h2>
        <p id="hours">Hours</p>
        <p id="minutes">Minutes</p>
        <p id="seconds">Seconds</p>
        <p id="date">📅Date</p>
    </div>
    <div id="day">
        <p id="daydisplay"><i class="fa-solid fa-sun"></i>Day</p>
        </div>
        <div id="month">
        <p id="monthdisplay"><i class="fa-solid fa-calendar-days"></i>Month</p>
    </div>
    <div id="foot">
        <p>"Better Three Hours Too Soon,Than A Minute Too Late."</p>
        <p>-William Shakespeare</p>
    </div>
</body>
<script src="digitalclock.js"></script>
</html>
